[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BrickLabo"
version = "0.1.36"
description = "Logiciel de création d'étiquettes pour rangements de briques de construction et gestion du stock"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<6.12",
    "numpy>=1.26,<3",
    "Pillow>=10.4,<13",
    "reportlab>=4.2,<5",
]

[project.scripts]
bricklabo = "atelier.app:main"

[tool.setuptools]
packages = ["atelier"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
